/* Compact end card using the official LP&#x27;s original first-view assets. */
#end{padding:clamp(12px,2.2vh,22px) 18px;gap:8px;background:linear-gradient(155deg,#e8f3e9f7,#fff9edfa);backdrop-filter:blur(8px)}

.ctaBridge{font-size:13px;line-height:1.6;color:#58726b;margin:0}
.offerCard{width:100%;max-width:400px;background:white;border:1px solid #eadfc8;border-radius:23px;padding:14px 15px 10px;box-shadow:0 8px 28px #396c4715}
.fvArtwork{display:flex;align-items:center;flex-direction:column;gap:5px;width:100%;background:#fffdf6;border-radius:12px;padding:8px 0 3px}
.fvArtwork img{display:block;object-fit:contain;flex-shrink:0;width:100%;height:auto}
.fvArtwork .fvTitle{max-height:clamp(78px,14vh,118px)}
.fvArtwork .fvPrice{max-height:clamp(122px,24vh,203px)}
.offerBenefits{display:flex;justify-content:center;gap:0;padding:10px 0;font-size:12px;color:#537b66;line-height:1.6}
.offerBenefits span{width:50%;text-align:center;white-space:nowrap}
.offerBenefits span+span{border-left:1px solid #dce7d9}
.offerBenefits strong{display:block;font-size:15px;color:#237248;font-weight:900}
#end #cta{background:#008c43;box-shadow:0 5px 0 #006e35;border-radius:12px;font-size:16px;padding:14px 3px;white-space:nowrap}
#end #cta span{font-size:22px;line-height:0;vertical-align:-1px;margin-left:4px}
.offerAfter{font-size:11px;color:#67816f;margin:10px 0 0}
#end .fine{font-size:10px;line-height:1.55;max-width:400px;text-align:left;margin:0}
#end #replay{font-size:13px;padding:6px 12px;flex-shrink:0}

/* Playable usability refinement */
#operationGuide{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:800;color:#21755b;line-height:1.5}
.guideIcon{display:inline-block;font-size:18px;animation:guideTap 1.1s ease-in-out infinite}

#end #replay{font-size:14px;min-height:36px;padding:7px 12px}
.readablePrice{display:none;color:#167942;padding:5px 0;line-height:1.3}

/* Result card: success first, then the remaining damage. */
#resolved{background:#163c4866;backdrop-filter:blur(3px)}
#resolved .panel{width:calc(100% - 40px);max-width:360px;padding:0;border:2px solid #fff;border-radius:26px;overflow:hidden;background:#fffdf7;box-shadow:0 18px 60px #102f4540;max-height:92%;animation:result-in .28s ease-out}
.resolve-success{display:flex;align-items:center;justify-content:center;gap:10px;padding:25px 16px 32px;background:#eaf5ef}
#resolved .stamp{width:34px;height:34px;flex-shrink:0;margin:0;border:2px solid #fff;background:#26836a;color:#fff;font-size:23px;box-shadow:0 2px 5px #19654c18}
#resolved #resolveTitle{font-size:clamp(20px,5.7vw,25px);line-height:1.35;color:#216c56;letter-spacing:-.02em}
.resolve-aftermath{position:relative;padding:32px 18px 23px;border-top:1px solid #ecdabb;background:#fffaf0}

.resolve-damage-icon{display:flex;align-items:center;justify-content:center;margin:5px auto 12px;width:49px;height:49px;border:1px solid #ebd7b7;border-radius:50%;background:#fff;color:#b97832}
.resolve-damage-icon svg{width:27px;height:27px}
#resolved #resolveDetail{font-size:clamp(20px,5.8vw,25px);line-height:1.55;font-weight:800;color:#4b493e;margin:0;letter-spacing:-.025em;overflow-wrap:anywhere}
#resolved .resolve-next{display:block;font-size:12px;line-height:1.8;color:#80725f;margin:12px auto 0;padding-top:12px;border-top:1px dashed #e6d8be;max-width:260px}
@keyframes result-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

/* Compact end card using the official LP&#x27;s original first-view assets. */
#end{padding:clamp(12px,2.2vh,22px) 18px;gap:8px;background:linear-gradient(155deg,#e8f3e9f7,#fff9edfa);backdrop-filter:blur(8px)}

#end h2{font-size:clamp(25px,3.6vh,32px);line-height:1.32;margin:0;color:#1f5448}
.ctaBridge{font-size:13px;line-height:1.6;color:#58726b;margin:0}
.offerCard{width:100%;max-width:400px;background:white;border:1px solid #eadfc8;border-radius:23px;padding:14px 15px 10px;box-shadow:0 8px 28px #396c4715}

.offerBenefits{display:flex;justify-content:center;gap:0;padding:10px 0;font-size:12px;color:#537b66;line-height:1.6}
.offerBenefits span{width:50%;text-align:center;white-space:nowrap}

.offerBenefits strong{display:block;font-size:15px;color:#237248;font-weight:900}
#end #cta{background:#008c43;box-shadow:0 5px 0 #006e35;border-radius:12px;font-size:16px;padding:14px 3px;white-space:nowrap}
#end #cta span{font-size:22px;line-height:0;vertical-align:-1px;margin-left:4px}
.offerAfter{font-size:11px;color:#67816f;margin:10px 0 0}
#end .fine{font-size:10px;line-height:1.55;max-width:400px;text-align:left;margin:0}

@keyframes result-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#resolved .panel{animation:none}}
